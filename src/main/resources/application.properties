spring.application.name=bug-hunter-agent
server.port=8080

# Configuración de GitHub
github.owner=${GITHUB_OWNER}
github.repo=${GITHUB_REPO}
github.token=${GITHUB_PERSONAL_ACCESS_TOKEN}

# Configuración de OpenAI / LLM (Globant Proxy)
openai.api.key=${OPENAI_API_KEY}
openai.base.url=${OPENAI_BASE_URL:https://api.clients.globant.com/v1}
openai.model.name=${OPENAI_MODEL_NAME:globant_dgx/GLM-5.3-Flash}

# Servidor SMTP de Gmail para enviar el informe
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
report.recipient=${REPORT_RECIPIENT}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



